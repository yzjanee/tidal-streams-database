    ivoa:ucd: pos.pm;pos.eq.ra
    fits:tunit: mas/yr
  - name: pm_ra_error
    '@id': '#ProperMotions.pm_ra_error'
    datatype: double
    nullable: false
    description: Pm Ra Error
    ivoa:ucd: stat.error;pos.pm;pos.eq.ra
    fits:tunit: mas/yr
  - name: pm_dec
    '@id': '#ProperMotions.pm_dec'
