name: shipp2019
'@id': '#shipp2019'
description: 'Stellar stream members from Shipp+2019 x Gaia EDR3 x S5/Li+2022. 146 stars in 10 streams:
  AliqaUma, ATLAS, Chenab, Elqui, Indus, Jhelum-a, Jhelum-b, Phoenix, TucanaIII, Turranburra.'
tables:
- name: Sources
  '@id': '#Sources'
  description: Primary source table — one row per astronomical object
  columns:
  - name: source
    '@id': '#Sources.source'
    datatype: long
    nullable: false
    description: Source
  - name: ra_deg
    '@id': '#Sources.ra_deg'
    datatype: double
    nullable: false
    description: Ra Deg
    ivoa:ucd: pos.eq.ra;meta.main
    fits:tunit: deg
  - name: dec_deg
    '@id': '#Sources.dec_deg'
    datatype: double
    nullable: false
    description: Dec Deg
    ivoa:ucd: pos.eq.dec;meta.main
    fits:tunit: deg
  - name: adopted
    '@id': '#Sources.adopted'
    datatype: string
    nullable: true
    description: Whether this is the adopted value
    length: 100
  - name: reference
    '@id': '#Sources.reference'
    datatype: string
    nullable: true
    description: Publication reference key
    length: 50
  - name: comments
    '@id': '#Sources.comments'
    datatype: string
    nullable: true
    description: Free-text notes
    length: 500
  primaryKey: '#Sources.source'
- name: Names
  '@id': '#Names'
  description: Alternative names and cross-match identifiers
  columns:
  - name: source
    '@id': '#Names.source'
    datatype: string
    nullable: true
    description: Foreign key to Sources.source
    length: 100
  - name: other_name
    '@id': '#Names.other_name'
    datatype: double
    nullable: true
    description: Other Name
  - name: adopted
    '@id': '#Names.adopted'
    datatype: string
    nullable: true
    description: Whether this is the adopted value
    length: 100
  - name: reference
    '@id': '#Names.reference'
    datatype: string
    nullable: true
    description: Publication reference key
    length: 50
  - name: comments
    '@id': '#Names.comments'
    datatype: string
    nullable: true
    description: Free-text notes
    length: 500
  constraints:
  - type: ForeignKey
    '@id': '#Names_source_fk'
    name: Names_source_fk
    columns:
    - '#Names.source'
    referencedColumns:
    - '#Sources.source'
- name: AssociationList
  '@id': '#AssociationList'
  description: Lookup table of known stellar associations/streams
  columns:
  - name: association
    '@id': '#AssociationList.association'
    datatype: string
    nullable: false
    description: Association
    length: 100
  - name: comments
    '@id': '#AssociationList.comments'
    datatype: string
    nullable: true
    description: Comments
    length: 500
  - name: adopted
    '@id': '#AssociationList.adopted'
    datatype: string
    nullable: true
    description: Whether this is the adopted value
    length: 100
  - name: reference
    '@id': '#AssociationList.reference'
    datatype: string
    nullable: true
    description: Publication reference key
    length: 50
- name: Associations
  '@id': '#Associations'
  description: Source membership in associations with probability
  columns:
  - name: source
    '@id': '#Associations.source'
    datatype: string
    nullable: true
    description: Foreign key to Sources.source
    length: 100
  - name: membership_probability
    '@id': '#Associations.membership_probability'
    datatype: double
    nullable: false
    description: Membership Probability
    ivoa:ucd: stat.probability
  - name: adopted
    '@id': '#Associations.adopted'
    datatype: string
    nullable: true
    description: Whether this is the adopted value
    length: 100
  - name: reference
    '@id': '#Associations.reference'
    datatype: string
    nullable: true
    description: Publication reference key
    length: 50
  - name: comments
    '@id': '#Associations.comments'
    datatype: string
    nullable: true
    description: Free-text notes
    length: 500
  constraints:
  - type: ForeignKey
    '@id': '#Associations_source_fk'
    name: Associations_source_fk
    columns:
    - '#Associations.source'
    referencedColumns:
    - '#Sources.source'
- name: Parallaxes
  '@id': '#Parallaxes'
  description: Trigonometric parallax measurements (Gaia EDR3)
  columns:
  - name: source
    '@id': '#Parallaxes.source'
    datatype: string
    nullable: true
    description: Foreign key to Sources.source
    length: 100
  - name: parallax_mas
    '@id': '#Parallaxes.parallax_mas'
    datatype: double
    nullable: false
    description: Parallax Mas
    ivoa:ucd: pos.parallax
    fits:tunit: mas
  - name: parallax_error
    '@id': '#Parallaxes.parallax_error'
    datatype: double
    nullable: false
    description: Parallax Error
    ivoa:ucd: stat.error;pos.parallax
    fits:tunit: mas
  - name: adopted
    '@id': '#Parallaxes.adopted'
    datatype: string
    nullable: true
    description: Whether this is the adopted value
    length: 100
  - name: reference
    '@id': '#Parallaxes.reference'
    datatype: string
    nullable: true
    description: Publication reference key
    length: 50
  - name: comments
    '@id': '#Parallaxes.comments'
    datatype: string
    nullable: true
    description: Free-text notes
    length: 500
  constraints:
  - type: ForeignKey
    '@id': '#Parallaxes_source_fk'
    name: Parallaxes_source_fk
    columns:
    - '#Parallaxes.source'
    referencedColumns:
    - '#Sources.source'
