  - name: adopted
    '@id': '#ProperMotions.adopted'
    datatype: string
    nullable: true
    description: Whether this is the adopted value
    length: 100
  - name: reference
    '@id': '#ProperMotions.reference'
    datatype: string
    nullable: true
    description: Publication reference key
    length: 50
  - name: comments
    '@id': '#ProperMotions.comments'
    datatype: string
    nullable: true
    description: Free-text notes
    length: 500
  constraints:
  - type: ForeignKey
    '@id': '#ProperMotions_source_fk'
    name: ProperMotions_source_fk
    columns:
    - '#ProperMotions.source'
    referencedColumns:
    - '#Sources.source'
- name: RadialVelocities
  '@id': '#RadialVelocities'
  description: Radial velocities from S5/Li+2022 (85/146 sources)
  columns:
  - name: source
    '@id': '#RadialVelocities.source'
    datatype: string
    nullable: true
    description: Foreign key to Sources.source
    length: 100
  - name: rv_kms
    '@id': '#RadialVelocities.rv_kms'
    datatype: double
    nullable: true
    description: nullable — only 85/146 sources have S5 radial velocities
    ivoa:ucd: spect.dopplerVeloc.opt
    fits:tunit: km/s
  - name: rv_error
    '@id': '#RadialVelocities.rv_error'
    datatype: double
    nullable: true
    description: nullable — only 85/146 sources have S5 radial velocities
    ivoa:ucd: stat.error;spect.dopplerVeloc
    fits:tunit: km/s
  - name: adopted
    '@id': '#RadialVelocities.adopted'
    datatype: string
    nullable: true
    description: Whether this is the adopted value
    length: 100
  - name: reference
    '@id': '#RadialVelocities.reference'
    datatype: string
    nullable: true
    description: Publication reference key
    length: 50
  - name: comments
    '@id': '#RadialVelocities.comments'
    datatype: string
    nullable: true
    description: Free-text notes
    length: 500
  constraints:
  - type: ForeignKey
    '@id': '#RadialVelocities_source_fk'
    name: RadialVelocities_source_fk
    columns:
    - '#RadialVelocities.source'
    referencedColumns:
    - '#Sources.source'
- name: Photometry
  '@id': '#Photometry'
